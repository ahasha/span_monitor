[project]
name = "span-monitor"
version = "0.1.0"
description = "A background service to log span panel energy data to a database"
authors = [{ name = "Alex Hasha", email = "alex@hashadatascience.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.3,<3",
    "python-dotenv>=1.0.1,<2",
    "psycopg2-binary>=2.9.9,<3",
    "supabase>=2.7.3,<3",
    "ipykernel>=6.29.5,<7",
    "pandas>=2.2.2,<3",
    "polars>=1.0,<2",
    "click>=8.1,<9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-mock>=3.15.1,<4",
]

[tool.uv]
package = false
